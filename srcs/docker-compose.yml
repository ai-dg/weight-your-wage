services:
  # ── Monitoring ─────────────────────────────────────────────────────────────
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    user: "${UID}:${GID}"
    volumes:
      - model:/usr/share/model/
    networks:
      - model_network
  # ── MinIO (Data Lake & Artifacts) ──────────────────────────────────────────
  minio:
    container_name: minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    user: "${UID}:${GID}"
    volumes:
      - mlflow-minio:/data
    networks:
      - postgres_network

  # ── Metrics (MLflow) ───────────────────────────────────────────────────────
  mlflow:
    container_name: mlflow-server
    build:
      context: ./services/mlflow
      dockerfile: Dockerfile
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports:
      - "${MLFLOW_SERVER_PORT:-5000}:5000"
    expose:
      - 5000
    environment:
      MLFLOW_SERVER_HOST: 0.0.0.0
      MLFLOW_SERVER_PORT: 5000
      BACKEND_STORE_URI: postgresql+psycopg2://mlflow:mlflow@postgres_db:5432/mlflowdb
      ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

      MLFLOW_USER: ${DB_MLFLOW_USER}
      MLFLOW_PASSWORD: ${DB_MLFLOW_PASSWORD}
      MLFLOW_DB: ${DB_MLFLOW_NAME}
      
    command: >
      mlflow server 
      --backend-store-uri postgresql://${DB_MLFLOW_USER}:${DB_MLFLOW_PASSWORD}@postgres:5432/${DB_MLFLOW_NAME}
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0 
      --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - postgres_network
      - model_network

  # ── API ────────────────────────────────────────────────────────────────────
  fastapi:
    container_name: fastapi
    build:
      context: ..
      dockerfile: srcs/api/Dockerfile
    expose:
      - 4243
    ports:
      - "0.0.0.0:4243:4243"
    #user: "${UID}:${GID}"
    volumes:
      - source_python:/app/.venv
      - model:/app/model/

    networks:
      - model_network

  # ── Gateway ────────────────────────────────────────────────────────────────
  nginx:
    container_name: nginx
    build:
      context: ./services/nginx
      dockerfile: Dockerfile

  # ── Database (app) ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    user: "${UID}:${GID}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - postgres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_contain
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - postgres_network

  # ── Frontend ───────────────────────────────────────────────────────────────
  streamlite:
    container_name: streamlite
    build:
      context: ./services/streamlite
      dockerfile: Dockerfile

  frontend:
    profiles: ["dev"]
    container_name: frontend
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "npm install && npm run dev:docker"
    environment:
      FASTAPI_INTERNAL_URL: http://fastapi:4243
      PREDICT_PATH: /predict
      NEXT_PUBLIC_PREDICT_URL: /api/predict
      NEXT_PUBLIC_WRANGLER_PORT: ${WRANGLER_PORT:-8788}
      PORT: ${FRONTEND_INTERNAL_PORT:-3001}
      WRANGLER_INTERNAL_PORT: ${WRANGLER_INTERNAL_PORT:-8788}
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./services/frontend/cf-dev-vars.docker:/app/.dev.vars:ro
    ports:
      - "${FRONTEND_PORT:-3001}:${FRONTEND_INTERNAL_PORT:-3001}"
      - "${WRANGLER_PORT:-8788}:${WRANGLER_INTERNAL_PORT:-8788}"
    depends_on:
      - fastapi
    networks:
      - model_network

volumes:
  postgres_data:
  mlflow-minio:
  model_artifacts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/data/artifacts
  model:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/model
  source_python:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.venv
  frontend_node_modules:

networks:
  postgres_network:
    driver: bridge
  model_network:
    driver: bridge
