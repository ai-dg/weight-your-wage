services:
  # ── Monitoring ─────────────────────────────────────────────────────────────
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    user: "${UID}:${GID}"
    volumes:
      # - model:/usr/share/model/
      # - grafana_data:/var/lib/grafana
      - ${PWD}/srcs/services/grafana/provisioning:/etc/grafana/provisioning
      - ${PWD}/srcs/services/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ${PWD}/srcs/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "${CADVISOR_PORT:-9080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
  
  loki:
    container_name: loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ${PWD}/srcs/services/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    container_name: promtail
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${PWD}/srcs/services/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring

  # ── MinIO (Data Lake & Artifacts) + Bucket ──────────────────────────────────────────
  minio:
    container_name: minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" #API
      - "9001:9001" #WEB UI
    volumes:
      - mlflow-minio:/data
    networks:
      - postgres_network
      - model_network

  create_buckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - postgres_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo '...waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/mlflow-artifacts || true;
      exit 0;
      "

  # ── Metrics (MLflow) ───────────────────────────────────────────────────────
  mlflow:
    container_name: mlflow-server
    build:
      context: ./services/mlflow
      dockerfile: Dockerfile
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports:
      - "${MLFLOW_SERVER_PORT:-5000}:5000"
    expose:
      - 5000
    environment:
      - MLFLOW_SERVER_HOST=0.0.0.0
      - MLFLOW_SERVER_PORT=5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_IGNORE_TLS=true
      
    command: >
      mlflow server 
      --backend-store-uri postgresql://${DB_MLFLOW_USER}:${DB_MLFLOW_PASSWORD}@postgres:5432/${DB_MLFLOW_NAME}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0 
      --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - postgres_network
      - model_network

  # ── API ────────────────────────────────────────────────────────────────────
  fastapi:
    container_name: fastapi
    build:
      context: ..
      dockerfile: srcs/api/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
      network: host
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - APP_UID=${UID:-1000}
      - APP_GID=${GID:-1000}
      - USER=appuser
      - LOGNAME=appuser
    # GPU : Docker exige NVIDIA Container Toolkit sur l’hôte, sinon erreur
    # « could not select device driver nvidia ». Activer avec USE_GPU=1 make …
    # (fichier srcs/docker-compose.gpu.yml).
    expose:
      - 4243
    ports:
      - "0.0.0.0:4243:4243"
    volumes:
      - model:/app/srcs/model/
      - api:/app/srcs/api/
      # Même dossier : srcs/.venv (hôte) = /app/.uv-tool (conteneur) — uv + dépendances projet
      - source_python:/app/.uv-tool
    networks:
      - model_network


  # ── Gateway ────────────────────────────────────────────────────────────────
  nginx:
    container_name: nginx
    build:
      context: ./services/nginx
      dockerfile: Dockerfile

  # ── Database (app) ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    user: "${UID}:${GID}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - postgres_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_contain
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres_network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    ports:
      - "3001:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_metadata
      - MB_DB_PORT=${DB_PORT}
      - MB_DB_USER=${DB_USER}
      - MB_DB_PASS=${DB_PASSWORD}
      - MB_DB_HOST=postgres
      - MB_ADMIN_EMAIL=${METABASE_ADMIN_EMAIL}
      - MB_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD}
      - MB_ADMIN_FIRST_NAME=${METABASE_ADMIN_FIRST_NAME}
      - MB_ADMIN_LAST_NAME=${METABASE_ADMIN_LAST_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_network


  # ── Frontend ───────────────────────────────────────────────────────────────
  streamlite:
    container_name: streamlite
    build:
      context: ./services/streamlite
      dockerfile: Dockerfile

  frontend:
    profiles: ["dev"]
    container_name: frontend
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "npm install && npm run dev:docker"
    environment:
      FASTAPI_INTERNAL_URL: http://fastapi:4243
      PREDICT_PATH: /predict
      NEXT_PUBLIC_PREDICT_URL: /api/predict
      NEXT_PUBLIC_WRANGLER_PORT: ${WRANGLER_PORT:-8788}
      PORT: ${FRONTEND_INTERNAL_PORT:-3001}
      WRANGLER_INTERNAL_PORT: ${WRANGLER_INTERNAL_PORT:-8788}
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./services/frontend/cf-dev-vars.docker:/app/.dev.vars:ro
    ports:
      - "${FRONTEND_PORT:-3001}:${FRONTEND_INTERNAL_PORT:-3001}"
      - "${WRANGLER_PORT:-8788}:${WRANGLER_INTERNAL_PORT:-8788}"
    depends_on:
      - fastapi
    networks:
      - model_network

volumes:
  postgres_data:
  pgadmin_data:
  mlflow-minio:
  model:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/model
  api:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/api
  source_python:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/.venv
  frontend_node_modules:

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/data/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/data/grafana_data

networks:
  postgres_network:
    driver: bridge
  monitoring:
    driver: bridge
  model_network:
    driver: bridge